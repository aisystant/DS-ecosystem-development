<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 490" font-family="Arial, sans-serif">
  <rect width="1040" height="490" fill="#ffffff"/>
  <text x="40" y="45" font-size="28" font-weight="bold" fill="#1a3a5c">Рост не переключается, а накапливается</text>

  <!-- grid geometry -->
  <!-- row labels column: x 40-220, then 4 columns each 190 wide starting x=220, rows start y=90 height 70 -->
  <g font-size="15" fill="#1a3a5c">
    <text x="315" y="80" text-anchor="middle" font-weight="bold">Внимание</text>
    <text x="505" y="80" text-anchor="middle" font-weight="bold">Мировоззрение</text>
    <text x="695" y="80" text-anchor="middle" font-weight="bold">Мастерство</text>
    <text x="885" y="80" text-anchor="middle" font-weight="bold">Системы</text>
  </g>

  <!-- row 0: Марафон -->
  <text x="40" y="135" font-size="16" font-weight="bold" fill="#1a3a5c">S0 Марафон</text>
  <rect x="220" y="100" width="190" height="60" fill="#12308f"/>
  <text x="315" y="135" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">растит</text>
  <rect x="410" y="100" width="190" height="60" rx="4" fill="#fdf1e0" stroke="#e8a33d" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="505" y="135" text-anchor="middle" fill="#92400e" font-size="15" font-weight="bold">по возможности</text>
  <rect x="600" y="100" width="190" height="60" fill="#eef2f7"/>
  <rect x="790" y="100" width="190" height="60" fill="#eef2f7"/>

  <!-- row 1: Собранность -->
  <text x="40" y="205" font-size="16" font-weight="bold" fill="#1a3a5c">S1 Собранность</text>
  <rect x="220" y="170" width="190" height="60" fill="#12308f"/>
  <text x="315" y="205" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">крепче</text>
  <rect x="410" y="170" width="190" height="60" fill="#6d9ee8"/>
  <text x="505" y="205" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">первый заход</text>
  <rect x="600" y="170" width="190" height="60" rx="4" fill="#fdf1e0" stroke="#e8a33d" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="695" y="205" text-anchor="middle" fill="#92400e" font-size="15" font-weight="bold">по возможности</text>
  <rect x="790" y="170" width="190" height="60" rx="4" fill="#fdf1e0" stroke="#e8a33d" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="885" y="205" text-anchor="middle" fill="#92400e" font-size="15" font-weight="bold">по возможности</text>

  <!-- row 2: Агентность -->
  <text x="40" y="275" font-size="16" font-weight="bold" fill="#1a3a5c">S2 Агентность</text>
  <rect x="220" y="240" width="190" height="60" fill="#c9dcf7"/>
  <text x="315" y="275" text-anchor="middle" fill="#1a3a5c" font-size="16" font-weight="bold">продолжение</text>
  <rect x="410" y="240" width="190" height="60" fill="#12308f"/>
  <text x="505" y="275" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">крепче</text>
  <rect x="600" y="240" width="190" height="60" fill="#6d9ee8"/>
  <text x="695" y="275" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">первый заход</text>
  <rect x="790" y="240" width="190" height="60" rx="4" fill="#fdf1e0" stroke="#e8a33d" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="885" y="275" text-anchor="middle" fill="#92400e" font-size="15" font-weight="bold">по возможности</text>

  <!-- row 3: Системность -->
  <text x="40" y="345" font-size="16" font-weight="bold" fill="#1a3a5c">S3 Системность</text>
  <rect x="220" y="310" width="190" height="60" fill="#c9dcf7"/>
  <text x="315" y="345" text-anchor="middle" fill="#1a3a5c" font-size="16" font-weight="bold">продолжение</text>
  <rect x="410" y="310" width="190" height="60" fill="#c9dcf7"/>
  <text x="505" y="345" text-anchor="middle" fill="#1a3a5c" font-size="16" font-weight="bold">продолжение</text>
  <rect x="600" y="310" width="190" height="60" fill="#12308f"/>
  <text x="695" y="345" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">крепче</text>
  <rect x="790" y="310" width="190" height="60" fill="#6d9ee8"/>
  <text x="885" y="345" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">первый заход</text>

  <!-- caption -->
  <rect x="40" y="395" width="960" height="80" rx="8" fill="#f2f6fc"/>
  <text x="60" y="420" font-size="14" fill="#334155">Ничего не выключается: то, что наросло раньше, остаётся. Ступень подтверждается по всем измерениям сразу, не по одному практикуму.</text>
  <text x="60" y="444" font-size="13" fill="#64748b">Светло-голубое без подписи и «продолжение» — несём дальше без отдельного фокуса. Пунктир «по возможности» — не обязательно, если будет ресурс.</text>
  <text x="60" y="465" font-size="13" fill="#64748b">Тёмно-синее — главный фокус шага. Среднее «первый заход» — новое направление, которое только открывается.</text>
</svg>

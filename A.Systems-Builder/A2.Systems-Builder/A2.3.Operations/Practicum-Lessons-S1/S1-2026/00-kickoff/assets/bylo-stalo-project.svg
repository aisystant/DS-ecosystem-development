<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Arial, sans-serif">
  <rect width="1200" height="640" fill="#ffffff"/>

  <!-- Left column: BYLO -->
  <rect x="30" y="30" width="270" height="24" rx="12" fill="#dbe4ee"/>
  <text x="165" y="47" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">БЫЛО</text>

  <g font-size="15" text-anchor="middle" fill="#334155">
    <rect x="60" y="75"  width="210" height="46" rx="6" fill="#eef2f7"/>
    <text x="165" y="103">Руководство</text>
    <rect x="60" y="140" width="210" height="46" rx="6" fill="#eef2f7"/>
    <text x="165" y="168">Практика</text>
    <rect x="60" y="205" width="210" height="46" rx="6" fill="#eef2f7"/>
    <text x="165" y="233">Результат</text>
    <rect x="60" y="270" width="210" height="46" rx="6" fill="#eef2f7"/>
    <text x="165" y="292">Новое</text>
    <text x="165" y="310">руководство</text>
    <rect x="60" y="335" width="210" height="46" rx="6" fill="#eef2f7"/>
    <text x="165" y="363">Практика</text>
    <rect x="60" y="400" width="210" height="46" rx="6" fill="#eef2f7"/>
    <text x="165" y="428">Результат</text>
  </g>
  <g stroke="#9aa5b1" stroke-width="2">
    <line x1="165" y1="121" x2="165" y2="140"/>
    <line x1="165" y1="186" x2="165" y2="205"/>
    <line x1="165" y1="251" x2="165" y2="270"/>
    <line x1="165" y1="316" x2="165" y2="335"/>
    <line x1="165" y1="381" x2="165" y2="400"/>
  </g>
  <line x1="50" y1="460" x2="280" y2="70" stroke="#c0392b" stroke-width="3"/>
  <text x="165" y="495" text-anchor="middle" font-size="13" fill="#6b7280">один общий маршрут для всех</text>

  <!-- divider -->
  <line x1="330" y1="30" x2="330" y2="600" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Right column: STALO -->
  <rect x="360" y="30" width="270" height="24" rx="12" fill="#12308f"/>
  <text x="495" y="47" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">СТАЛО</text>
  <text x="360" y="90" font-size="24" font-weight="bold" fill="#1a3a5c">Проект задаёт,</text>
  <text x="360" y="120" font-size="24" font-weight="bold" fill="#1a3a5c">что нужно подключить сейчас</text>

  <!-- surrounding guide/practice cards -->
  <rect x="360" y="150" width="140" height="55" rx="6" fill="#eef2f7" stroke="#c9dcf7"/>
  <text x="430" y="182" text-anchor="middle" font-size="13" fill="#334155">Руководство</text>
  <rect x="720" y="150" width="140" height="55" rx="6" fill="#eef2f7" stroke="#c9dcf7"/>
  <text x="790" y="182" text-anchor="middle" font-size="13" fill="#334155">Практика</text>
  <rect x="360" y="220" width="140" height="55" rx="6" fill="#eef2f7" stroke="#c9dcf7"/>
  <text x="430" y="252" text-anchor="middle" font-size="13" fill="#334155">Руководство</text>
  <rect x="720" y="220" width="140" height="55" rx="6" fill="#eef2f7" stroke="#c9dcf7"/>
  <text x="790" y="252" text-anchor="middle" font-size="13" fill="#334155">Практика</text>

  <!-- central personal project box -->
  <rect x="520" y="175" width="180" height="90" rx="10" fill="#3d6cd0"/>
  <text x="610" y="210" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">ЛИЧНЫЙ</text>
  <text x="610" y="230" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">ПРОЕКТ</text>
  <text x="610" y="250" text-anchor="middle" font-size="11" fill="#dbe9fb">своя задача рядом</text>

  <g stroke="#3d6cd0" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="500" y1="177" x2="520" y2="200"/>
    <line x1="720" y1="177" x2="700" y2="200"/>
    <line x1="500" y1="247" x2="520" y2="235"/>
    <line x1="720" y1="247" x2="700" y2="235"/>
  </g>

  <line x1="610" y1="265" x2="610" y2="300" stroke="#3d6cd0" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="500" y="300" width="220" height="40" rx="20" fill="#c9dcf7"/>
  <text x="610" y="325" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a3a5c">Результат</text>

  <rect x="360" y="355" width="500" height="50" rx="8" fill="#f2f6fc"/>
  <text x="380" y="376" font-size="13" fill="#334155">Практика идёт сразу по нескольким руководствам —</text>
  <text x="380" y="394" font-size="13" fill="#334155">в зависимости от проекта, текущего навыка и целей.</text>

  <!-- work project scale-up -->
  <rect x="500" y="425" width="220" height="80" rx="10" fill="#12308f"/>
  <text x="610" y="455" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">РАБОЧИЙ ПРОЕКТ</text>
  <text x="610" y="475" text-anchor="middle" font-size="11" fill="#dbe9fb">тот же способ работы</text>
  <text x="610" y="490" text-anchor="middle" font-size="11" fill="#dbe9fb">на более сложной задаче</text>
  <line x1="610" y1="505" x2="610" y2="530" stroke="#12308f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="500" y="530" width="220" height="40" rx="20" fill="#c9dcf7"/>
  <text x="610" y="555" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a3a5c">Результат</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3d6cd0"/>
    </marker>
  </defs>

  <!-- footer -->
  <rect x="30" y="600" width="1140" height="1" fill="#e2e8f0"/>
  <text x="600" y="628" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a3a5c">ОДНА СЕССИЯ — ТРИ РЕЗУЛЬТАТА: проект · мастерство · ИИ-среда</text>
</svg>
